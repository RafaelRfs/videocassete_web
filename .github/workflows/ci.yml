name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.13']
        include:
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # sem ffmpeg no runner, os testes de download real são pulados; o resto é unitário
      - name: unit tests
        run: python -m unittest discover -s tests -v

  javascript:
    name: javascript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: syntax
        run: for f in extension/*.js; do node --check "$f"; done
      - name: unit tests
        run: node --test tests/js/extension.test.mjs
